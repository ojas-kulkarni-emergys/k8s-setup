
apiVersion: v1
kind: Namespace
metadata:
  name: observability-stack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability-stack
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: vllm
        metrics_path: /metrics
        static_configs:
          - targets:
              - "distilgpt2-service.llm-d-deployments.svc.cluster.local:8000"

      - job_name: llm-d-epp
        metrics_path: /metrics
        static_configs:
          - targets:
              - "llm-router-epp.llm-d-deployments.svc.cluster.local:9090"

      - job_name: envoy
        metrics_path: /stats/prometheus
        static_configs:
          - targets:
              - "llm-router-envoy-metrics.llm-d-deployments.svc.cluster.local:19001"

      # Optional: add your actual OpenCost metrics endpoint here.
      # - job_name: opencost
      #   metrics_path: /metrics
      #   static_configs:
      #     - targets: ["<opencost-service>.<namespace>.svc.cluster.local:<port>"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: observability-stack
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability-stack.svc.cluster.local:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability-stack
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: llm-d official
        orgId: 1
        folder: llm-d
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/llm-d-dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability-stack
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
      nodePort: 30508
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability-stack
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - name: web
              containerPort: 3000
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://flounder-sphere-dab.ngrok-free.dev/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: llm-d-dashboards
              mountPath: /var/lib/grafana/llm-d-dashboards
              readOnly: true
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: llm-d-dashboards
          configMap:
            name: llm-d-official-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
      nodePort: 30509
